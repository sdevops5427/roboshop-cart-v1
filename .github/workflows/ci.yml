name: Cart CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo npm test
  docker:
    runs-on: self-hosted
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker login
        run: from ecr
      - run: docker build -t 389841108590.dkr.ecr.us-east-1.amazonaws.com/cart .
        name: docker build
      - run: docker push -t 389841108590.dkr.ecr.us-east-1.amazonaws.com/cart
        name: docker build
